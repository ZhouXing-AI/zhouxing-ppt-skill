<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title"><title id="title">Counter Curves — original shallow plaster bas-relief</title><defs>
 <linearGradient id="plaster" x1="12%" y1="5%" x2="85%" y2="96%"><stop stop-color="#eeede7"/><stop offset=".45" stop-color="#dfded8"/><stop offset="1" stop-color="#c9cac3"/></linearGradient>
 <linearGradient id="flute" x1="0" y1="0" x2="1" y2=".12"><stop stop-color="#c5c6bf"/><stop offset=".22" stop-color="#eeede6"/><stop offset=".5" stop-color="#e0dfd8"/><stop offset="1" stop-color="#d0d0c9"/></linearGradient>
 <linearGradient id="ribbon" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#edece5"/><stop offset=".48" stop-color="#ddddd5"/><stop offset="1" stop-color="#c6c8bf"/></linearGradient>
 <radialGradient id="convex" cx="34%" cy="27%" r="74%"><stop stop-color="#eae9e2"/><stop offset=".55" stop-color="#ddddd5"/><stop offset="1" stop-color="#c5c7be"/></radialGradient>
 <filter id="raised" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
   <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="soft"/>
   <feOffset in="soft" dx="3" dy="4" result="lower"/><feFlood flood-color="#777d72" flood-opacity=".27"/><feComposite in2="lower" operator="in" result="shadow"/>
   <feOffset in="soft" dx="-2" dy="-3" result="upper"/><feFlood flood-color="#fffef6" flood-opacity=".65"/><feComposite in2="upper" operator="in" result="light"/>
   <feMerge><feMergeNode in="shadow"/><feMergeNode in="light"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <filter id="fine" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
   <feDropShadow dx="1.5" dy="2" stdDeviation="1.3" flood-color="#7c8176" flood-opacity=".27"/>
 </filter>
 </defs><path d="M241,712 C145,538 207,321 399,236 C489,195 573,208 639,240 C482,197 342,310 314,450 C291,559 321,649 371,733 C318,748 278,741 241,712Z" fill="url(#plaster)" filter="url(#raised)" /><path d="M762,309 C847,478 789,686 605,768 C524,804 447,797 387,770 C533,800 670,689 695,560 C718,455 688,373 642,294 C688,280 729,284 762,309Z" fill="url(#plaster)" filter="url(#raised)" /><path d="M271,699 C187,522 279,296 454,247" fill="none" stroke="#f5f3eb" stroke-opacity=".6" stroke-width="1.4" transform="translate(1.2 1.5)"/><path d="M271,699 C187,522 279,296 454,247" fill="none" stroke="#9fa598" stroke-opacity=".36" stroke-width="1.4"/><path d="M732,323 C806,490 725,700 554,755" fill="none" stroke="#f5f3eb" stroke-opacity=".6" stroke-width="1.4" transform="translate(1.2 1.5)"/><path d="M732,323 C806,490 725,700 554,755" fill="none" stroke="#9fa598" stroke-opacity=".36" stroke-width="1.4"/><circle cx="505" cy="505" r="51" fill="url(#convex)" filter="url(#raised)"/></svg>