<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title"><title id="title">Folded Horizon — original shallow plaster bas-relief</title><defs>
 <linearGradient id="plaster" x1="12%" y1="5%" x2="85%" y2="96%"><stop stop-color="#eeede7"/><stop offset=".45" stop-color="#dfded8"/><stop offset="1" stop-color="#c9cac3"/></linearGradient>
 <linearGradient id="flute" x1="0" y1="0" x2="1" y2=".12"><stop stop-color="#c5c6bf"/><stop offset=".22" stop-color="#eeede6"/><stop offset=".5" stop-color="#e0dfd8"/><stop offset="1" stop-color="#d0d0c9"/></linearGradient>
 <linearGradient id="ribbon" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#edece5"/><stop offset=".48" stop-color="#ddddd5"/><stop offset="1" stop-color="#c6c8bf"/></linearGradient>
 <radialGradient id="convex" cx="34%" cy="27%" r="74%"><stop stop-color="#eae9e2"/><stop offset=".55" stop-color="#ddddd5"/><stop offset="1" stop-color="#c5c7be"/></radialGradient>
 <filter id="raised" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
   <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="soft"/>
   <feOffset in="soft" dx="3" dy="4" result="lower"/><feFlood flood-color="#777d72" flood-opacity=".27"/><feComposite in2="lower" operator="in" result="shadow"/>
   <feOffset in="soft" dx="-2" dy="-3" result="upper"/><feFlood flood-color="#fffef6" flood-opacity=".65"/><feComposite in2="upper" operator="in" result="light"/>
   <feMerge><feMergeNode in="shadow"/><feMergeNode in="light"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <filter id="fine" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
   <feDropShadow dx="1.5" dy="2" stdDeviation="1.3" flood-color="#7c8176" flood-opacity=".27"/>
 </filter>
 </defs><path d="M150,348 C290,268 385,285 500,337 C625,394 744,395 850,324 C741,435 619,444 494,386 C369,328 267,328 150,348Z" fill="url(#ribbon)" filter="url(#raised)" /><path d="M178,344C320,302 389,323 500,365S726,417 822,350" fill="none" stroke="#f5f3eb" stroke-opacity=".6" stroke-width="1.2" transform="translate(1.2 1.5)"/><path d="M178,344C320,302 389,323 500,365S726,417 822,350" fill="none" stroke="#9fa598" stroke-opacity=".36" stroke-width="1.2"/><path d="M150,461 C290,381 385,398 500,450 C625,507 744,508 850,437 C741,548 619,557 494,499 C369,441 267,441 150,461Z" fill="url(#ribbon)" filter="url(#raised)" /><path d="M178,457C320,415 389,436 500,478S726,530 822,463" fill="none" stroke="#f5f3eb" stroke-opacity=".6" stroke-width="1.2" transform="translate(1.2 1.5)"/><path d="M178,457C320,415 389,436 500,478S726,530 822,463" fill="none" stroke="#9fa598" stroke-opacity=".36" stroke-width="1.2"/><path d="M150,574 C290,494 385,511 500,563 C625,620 744,621 850,550 C741,661 619,670 494,612 C369,554 267,554 150,574Z" fill="url(#ribbon)" filter="url(#raised)" /><path d="M178,570C320,528 389,549 500,591S726,643 822,576" fill="none" stroke="#f5f3eb" stroke-opacity=".6" stroke-width="1.2" transform="translate(1.2 1.5)"/><path d="M178,570C320,528 389,549 500,591S726,643 822,576" fill="none" stroke="#9fa598" stroke-opacity=".36" stroke-width="1.2"/><path d="M150,687 C290,607 385,624 500,676 C625,733 744,734 850,663 C741,774 619,783 494,725 C369,667 267,667 150,687Z" fill="url(#ribbon)" filter="url(#raised)" /><path d="M178,683C320,641 389,662 500,704S726,756 822,689" fill="none" stroke="#f5f3eb" stroke-opacity=".6" stroke-width="1.2" transform="translate(1.2 1.5)"/><path d="M178,683C320,641 389,662 500,704S726,756 822,689" fill="none" stroke="#9fa598" stroke-opacity=".36" stroke-width="1.2"/></svg>