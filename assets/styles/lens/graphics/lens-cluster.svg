 <linearGradient id="glass" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#FBFEFF" stop-opacity=".97"/><stop offset=".22" stop-color="#D7EAF2" stop-opacity=".88"/><stop offset=".5" stop-color="#B0CFDF" stop-opacity=".8"/><stop offset=".76" stop-color="#8AB1C6" stop-opacity=".94"/><stop offset="1" stop-color="#E6F3F8" stop-opacity=".96"/></linearGradient>
